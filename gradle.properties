pluginGroup = com.commitmate
pluginVersion = 0.1.4

# 为兼容本机 IntelliJ IDEA 2024.1（build 241）而下调到 241；
# 插件在 2025.3+ 上仍然可用，且经过 Plugin Verifier 验证。
pluginSinceBuild = 241

# 编译所针对的 IntelliJ Platform 版本（取最低支持版本，避免误用高版本 API）
platformVersion = 2024.1

# Kotlin 标准库由 IntelliJ Platform 提供，插件包内不再重复打包，避免类冲突
kotlin.stdlib.default.dependency = false

org.gradle.jvmargs = -Xmx2g -Dfile.encoding=UTF-8
org.gradle.java.installations.paths = D:/coding/JDK21,D:/coding/jdk-17.0.16.8-hotspot
